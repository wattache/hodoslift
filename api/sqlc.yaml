# sqlc lit le VRAI schéma — celui que brokkr vérifie contre la base
# (`make -C api-python schema-verifier`) — et les requêtes SQL de sindri, et
# engendre des fonctions Go typées. Une colonne renommée ne compile plus.
version: "2"
sql:
  - engine: "postgresql"
    schema: "../api-python/docs/postgres-schema.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
