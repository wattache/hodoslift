<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/marque/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/marque/icone-any.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D4A843" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hodos" />
    <title>Hodos par French Forge</title>

    <!-- =====================================================================
         L'ARBITRAGE ENTRE LES DEUX INTROS — avant tout rendu.

         ⚠️ IL EST DANS LE `<head>` ET SANS `defer`, ET C'EST LE POINT. Il pose
         un attribut sur `<html>` que la feuille juste en dessous lit pour
         masquer l'un des deux blocs. Différé, les DEUX seraient peints le temps
         d'une image, empilés l'un sur l'autre.

         ⚠️ ET `sessionStorage` PEUT LEVER. Navigation privée, données de site
         bloquées, capture de vignette : l'accès lui-même jette, pas seulement
         la lecture. Sans ce `try`, l'exception laissait `data-intro` vide, donc
         les deux blocs visibles — exactement ce qu'on voulait éviter. Le repli
         est « boot », le plus court : mieux vaut rater une ouverture que servir
         2,5 s d'animation à chaque rechargement.
         ================================================================== -->
    <script>
      (function () {
        var premier = false;
        try {
          premier = !sessionStorage.getItem('hodos.opened');
          sessionStorage.setItem('hodos.opened', '1');
        } catch (e) {
          premier = false;
        }
        document.documentElement.dataset.intro = premier ? 'open' : 'boot';

        // ⚠️ LA STRUCTURE DE L'OUVERTURE D'AVANT (FRE-13). L'app l'écrit sous
        // `hodos.structure` (`src/lib/structure.ts`) dès qu'elle sait où l'on
        // est ; on ne peut pas attendre de le savoir ICI — rien n'est encore
        // chargé, et personne n'est connecté. Même garde que plus haut : un
        // stockage qui lève retombe sur French Forge, la structure par défaut.
        // Seules les structures qui ONT une ouverture sont reconnues ; toute
        // autre valeur (une structure sans logo, un slug inconnu) retombe sur
        // celle de French Forge.
        var structure = 'french-forge';
        try {
          var retenue = localStorage.getItem('hodos.structure');
          if (retenue === 'scappulift' || retenue === 'elgustolift') structure = retenue;
        } catch (e) { /* French Forge */ }
        document.documentElement.dataset.structure = structure;
      })();
    </script>
    <style>
      /* L'intro jouée : chargement OU ouverture… */
      html[data-intro="boot"] #open, html[data-intro="boot"] #open-sc, html[data-intro="boot"] #open-eg { display: none }
      html[data-intro="open"] #boot, html[data-intro="open"] #boot-sc, html[data-intro="open"] #boot-eg { display: none }
      /* …et celle de la structure (FRE-13). */
      html:not([data-structure="french-forge"]) #boot, html:not([data-structure="french-forge"]) #open { display: none }
      html:not([data-structure="scappulift"]) #boot-sc, html:not([data-structure="scappulift"]) #open-sc { display: none }
      html:not([data-structure="elgustolift"]) #boot-eg, html:not([data-structure="elgustolift"]) #open-eg { display: none }
    </style>

    <!-- =====================================================================
         L'ÉCRAN DE CHARGEMENT.

         CSS pur, aucune requête, aucune webfont — donc aucun texte : il peint
         avant le bundle. Sorti dans un fichier géré par le bundler, il
         arriverait après ce qu'il est censé masquer.

         ⚠️ LA MORPHOSE NE JOUE QU'UNE FOIS. Un logo qui se remonte en boucle
         donne l'impression que l'app est bloquée ; c'est la barre de
         progression, elle, qui dit « ça travaille ».
         ================================================================== -->
    <style>
      #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
            background:#1b1a1f;opacity:1;transition:opacity .26s ease}
      #boot.done{opacity:0;pointer-events:none}
      #boot svg{width:76px;height:76px;overflow:visible}
      #boot rect,#boot polygon{transform-box:fill-box}

      /* les quatre barres partent de la géométrie du bloc et rejoignent le dôme */
      #boot .b{transform-origin:0 0}
      @keyframes b0{from{transform:translate(-1px,16px) scale(.873,.6);fill-opacity:.38}to{transform:none;fill-opacity:.45}}
      @keyframes b1{from{transform:translate(-.3px,10px) scale(.873,1);fill-opacity:.66}to{transform:none;fill-opacity:.68}}
      @keyframes b2{from{transform:translate(.4px,2px) scale(.873,1.5333)}to{transform:none}}
      @keyframes b3{from{transform:translate(1.1px,14px) scale(.873,.7333);fill-opacity:.28;fill:#A9A5B0}to{transform:none;fill-opacity:.32;fill:#D4A843}}
      #boot .b0{animation:b0 .6s cubic-bezier(.65,0,.35,1) .22s both}
      #boot .b1{animation:b1 .6s cubic-bezier(.65,0,.35,1) .26s both}
      #boot .b2{animation:b2 .6s cubic-bezier(.65,0,.35,1) .30s both,pulse 1.5s ease-in-out 1.35s infinite}
      #boot .b3{animation:b3 .6s cubic-bezier(.65,0,.35,1) .34s both}
      @keyframes pulse{0%,100%{fill-opacity:1}50%{fill-opacity:.62}}

      /* l'ellipse se referme et découpe le dôme */
      @keyframes dome{from{rx:46px;ry:46px}to{rx:13px;ry:15px}}
      #boot .dome{animation:dome .44s cubic-bezier(.65,0,.35,1) .68s both}

      /* bandeau, nasal, cornes */
      @keyframes brow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
      @keyframes nasal{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
      @keyframes hornL{from{transform:translate(7.5px,5.5px);opacity:0}to{transform:none;opacity:1}}
      @keyframes hornR{from{transform:translate(-7.5px,5.5px);opacity:0}to{transform:none;opacity:1}}
      #boot .brow{transform-origin:50% 50%;animation:brow .34s cubic-bezier(.34,1.4,.64,1) .94s both}
      #boot .nasal{animation:nasal .3s cubic-bezier(.34,1.4,.64,1) 1.02s both}
      #boot .hornL{animation:hornL .36s cubic-bezier(.34,1.4,.64,1) 1.0s both}
      #boot .hornR{animation:hornR .36s cubic-bezier(.34,1.4,.64,1) 1.0s both}

      /* barre de progression indéterminée : c'est elle qui dit « chargement » */
      #boot .track{position:relative;width:96px;height:2px;background:#302e36;overflow:hidden;border-radius:2px}
      #boot .track i{position:absolute;top:0;bottom:0;width:34%;background:#D4A843;animation:slide 1.15s cubic-bezier(.45,0,.55,1) .5s infinite}
      @keyframes slide{from{left:-34%}to{left:100%}}

      @media (prefers-reduced-motion:reduce){
        #boot *{animation:none!important}
        #boot .track i{left:0;width:100%;animation:fade 1.6s ease-in-out infinite!important}
        @keyframes fade{0%,100%{opacity:1}50%{opacity:.3}}
      }
    </style>

    <!-- =====================================================================
         L'OUVERTURE — premier lancement d'une session seulement.

         ⚠️ ELLE CONTIENT DU TEXTE, contrairement au chargement, donc elle ne
         démarre qu'une fois la police prête (cf. le script en bas de page).
         Sans ce garde-fou, les lettres changent de dessin en cours d'écriture.
         ================================================================== -->
    <style>
      #open{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
            background:#1b1a1f;opacity:1;transition:opacity .3s ease}
      #open.done{opacity:0;pointer-events:none}
      #open .mark{width:96px;height:96px;overflow:visible}
      #open rect,#open polygon{transform-box:fill-box}
      #open .hold{visibility:hidden}
      #open.go .hold{visibility:visible}

      /* --- le bloc devient le casque --- */
      #open .b{transform-origin:0 0}
      @keyframes gb0{from{transform:translate(-1px,16px) scale(.873,.6);fill-opacity:.38}to{transform:none;fill-opacity:.45}}
      @keyframes gb1{from{transform:translate(-.3px,10px) scale(.873,1);fill-opacity:.66}to{transform:none;fill-opacity:.68}}
      @keyframes gb2{from{transform:translate(.4px,2px) scale(.873,1.5333)}to{transform:none}}
      @keyframes gb3{from{transform:translate(1.1px,14px) scale(.873,.7333);fill-opacity:.28;fill:#A9A5B0}to{transform:none;fill-opacity:.32;fill:#D4A843}}
      #open.go .b0{animation:gb0 .62s cubic-bezier(.65,0,.35,1) .18s both}
      #open.go .b1{animation:gb1 .62s cubic-bezier(.65,0,.35,1) .22s both}
      #open.go .b2{animation:gb2 .62s cubic-bezier(.65,0,.35,1) .26s both}
      #open.go .b3{animation:gb3 .62s cubic-bezier(.65,0,.35,1) .30s both}

      @keyframes gdome{from{rx:46px;ry:46px}to{rx:13px;ry:15px}}
      #open.go .dome{animation:gdome .46s cubic-bezier(.65,0,.35,1) .64s both}

      @keyframes gbrow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
      @keyframes gnasal{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
      @keyframes ghornL{from{transform:translate(7.5px,5.5px);opacity:0}to{transform:none;opacity:1}}
      @keyframes ghornR{from{transform:translate(-7.5px,5.5px);opacity:0}to{transform:none;opacity:1}}
      #open.go .brow{transform-origin:50% 50%;animation:gbrow .34s cubic-bezier(.34,1.4,.64,1) .90s both}
      #open.go .nasal{animation:gnasal .3s cubic-bezier(.34,1.4,.64,1) .98s both}
      #open.go .hornL{animation:ghornL .38s cubic-bezier(.34,1.4,.64,1) .96s both}
      #open.go .hornR{animation:ghornR .38s cubic-bezier(.34,1.4,.64,1) .96s both}

      /* --- HODOS s'écrit sous une plume qui passe --- */
      #open .word{position:relative;display:inline-block}
      #open .word b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:58px;line-height:.9;
                    letter-spacing:.055em;text-transform:uppercase;color:#EEECF2;clip-path:inset(0 100% 0 0)}
      @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -2% 0 0)}}
      #open.go .word b{animation:wipe .52s linear 1.22s both}
      #open .nib{position:absolute;top:-4%;bottom:-4%;width:2px;background:#D4A843;left:0;opacity:0}
      @keyframes nib{0%{left:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
      #open.go .nib{animation:nib .52s linear 1.22s both}

      /* --- by French Forge, lettre à lettre --- */
      #open .sig{display:flex;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#9A96A2}
      #open .sig span{opacity:0;transform:translateY(3px)}
      @keyframes sig{to{opacity:1;transform:none}}
      #open.go .sig span{animation:sig .24s ease-out both}
      #open.go .sig span:nth-child(1){animation-delay:1.58s}
      #open.go .sig span:nth-child(2){animation-delay:1.62s}
      #open.go .sig span:nth-child(3){animation-delay:1.66s}
      #open.go .sig span:nth-child(4){animation-delay:1.70s}
      #open.go .sig span:nth-child(5){animation-delay:1.74s}
      #open.go .sig span:nth-child(6){animation-delay:1.78s}
      #open.go .sig span:nth-child(7){animation-delay:1.82s}
      #open.go .sig span:nth-child(8){animation-delay:1.86s}
      #open.go .sig span:nth-child(9){animation-delay:1.90s}
      #open.go .sig span:nth-child(10){animation-delay:1.94s}
      #open.go .sig span:nth-child(11){animation-delay:1.98s}
      #open.go .sig span:nth-child(12){animation-delay:2.02s}
      #open.go .sig span:nth-child(13){animation-delay:2.06s}
      #open.go .sig span:nth-child(14){animation-delay:2.10s}
      #open.go .sig span:nth-child(15){animation-delay:2.14s}

      @media (prefers-reduced-motion:reduce){
        #open *{animation:none!important}
        #open .word b{clip-path:none}
        #open .sig span{opacity:1;transform:none}
        #open .nib{display:none}
      }
    </style>
    <!-- =====================================================================
         LES OUVERTURES DES AUTRES STRUCTURES (FRE-13) — le cadeau fait à
         chacune : le symbole Hodos se transforme en SON logo. French Forge
         est plus haut (`#boot`, `#open`) ; ici SCAPPULIFT (`-sc`) et
         ElGustoLift (`-eg`), dessinées par Claude Design le 18/09 sur le
         modèle French Forge, collées telles quelles.

         ⚠️ ELLES RÉUTILISENT `slide`, `fade`, `wipe`, `nib` ET `sig`, définies
         dans le CSS French Forge : ne pas les y renommer.

         ⚠️ SEULE UNE ELLIPSE DE `clipPath` S'ANIME, PAR `rx`/`ry` — le cas que
         Chromium accepte (le dôme French Forge fait pareil). Un enfant de
         `clipPath` animé par `transform` ne l'est pas : la première version
         SCAPPULIFT montrait ses barres déjà découpées dès la première image.

         ⚠️ LES QUATRE `from` DES BARRES (`sc0`…`sc3`, `eg0`…`eg3`) retombent
         exactement sur le symbole Hodos. Si un logo change de géométrie, ce
         sont eux qu'il faut recalculer, et rien d'autre.
         ================================================================== -->
    <style>
      /* ── SCAPPULIFT ─────────────────────────────────────────────── */
      #boot-sc,#open-sc{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
                        background:#1b1a1f;opacity:1;transition:opacity .28s ease}
      #boot-sc{gap:26px}
      #open-sc{z-index:10000;gap:30px}
      #boot-sc.done,#open-sc.done{opacity:0;pointer-events:none}
      #boot-sc .mark{width:76px;height:76px;overflow:visible}
      #open-sc .mark{width:96px;height:96px;overflow:visible}
      .sc rect,.sc polygon,.sc path{transform-box:fill-box}

      /* 1 — les quatre barres pivotent autour de la pointe et deviennent les bras */
      .sc .s{transform-origin:50% 100%}
      @keyframes sc0{from{transform:translate(-11.25px,-1.8px) scale(.9483,.391);fill:#D4A843;fill-opacity:.38}
                       to{transform:rotate(-31deg);fill:#EEECF2;fill-opacity:1}}
      @keyframes sc1{from{transform:translate(-3.75px,-1.8px) scale(.9483,.8197);fill:#D4A843;fill-opacity:.66}
                       to{transform:rotate(-12deg);fill:#EEECF2;fill-opacity:1}}
      @keyframes sc2{from{transform:translate(3.75px,-1.8px) scale(.9483,1.2568);fill:#D4A843;fill-opacity:1}
                       to{transform:rotate(12deg);fill:#EEECF2;fill-opacity:1}}
      @keyframes sc3{from{transform:translate(11.25px,-1.8px) scale(.9483,.4783);fill:#A9A5B0;fill-opacity:1}
                       to{transform:rotate(31deg);fill:#EEECF2;fill-opacity:1}}

      /* 2 — la lame se déploie depuis la pointe basse */
      @keyframes sclame{from{rx:0;ry:0}to{rx:34px;ry:34px}}

      /* 3 — les barres s'éteignent sous la lame */
      @keyframes sceff{from{opacity:1}to{opacity:0}}

      /* 4 — les cornes poussent depuis les épaules */
      @keyframes sccornG{from{transform:scale(.12) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
      @keyframes sccornD{from{transform:scale(.12) rotate(18deg);opacity:0}to{transform:none;opacity:1}}

      /* 5 — le grand losange tombe à sa place */
      @keyframes sctombe{from{transform:translateY(-7px) scale(.5);opacity:0}to{transform:none;opacity:1}}


      .sc .cornG{transform-origin:54.7% 92.7%}
      .sc .cornD{transform-origin:45.3% 92.7%}
      .sc .losange{transform-origin:50% 50%}

      #boot-sc .s0,#open-sc.go .s0{animation:sc0 .56s cubic-bezier(.65,0,.35,1) .18s both}
      #boot-sc .s1,#open-sc.go .s1{animation:sc1 .56s cubic-bezier(.65,0,.35,1) .22s both}
      #boot-sc .s2,#open-sc.go .s2{animation:sc2 .56s cubic-bezier(.65,0,.35,1) .26s both}
      #boot-sc .s3,#open-sc.go .s3{animation:sc3 .56s cubic-bezier(.65,0,.35,1) .30s both}
      #boot-sc .lame,#open-sc.go .lame{animation:sclame .46s cubic-bezier(.22,1,.36,1) .56s both}
      #boot-sc .barres,#open-sc.go .barres{animation:sceff .26s ease-in .76s both}
      #boot-sc .cornG,#open-sc.go .cornG{animation:sccornG .40s cubic-bezier(.34,1.42,.64,1) .94s both}
      #boot-sc .cornD,#open-sc.go .cornD{animation:sccornD .40s cubic-bezier(.34,1.42,.64,1) .94s both}
      #boot-sc .losange,#open-sc.go .losange{animation:sctombe .30s cubic-bezier(.34,1.5,.64,1) 1.04s both}
      #open-sc .hold{visibility:hidden}
      #open-sc.go .hold{visibility:visible}

      /* barre de progression indéterminée (chargement) */
      #boot-sc .track{position:relative;width:96px;height:2px;background:#302e36;overflow:hidden;border-radius:2px}
      #boot-sc .track i{position:absolute;top:0;bottom:0;width:34%;background:#D4A843;animation:slide 1.15s cubic-bezier(.45,0,.55,1) .5s infinite}

      /* HODOS, puis BY SCAPPULIFT */
      #open-sc .word{position:relative;display:inline-block}
      #open-sc .word b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:58px;line-height:.9;
                       letter-spacing:.055em;text-transform:uppercase;color:#EEECF2;clip-path:inset(0 100% 0 0)}
      #open-sc.go .word b{animation:wipe .52s linear 1.22s both}
      #open-sc .nib{position:absolute;top:-4%;bottom:-4%;width:2px;background:#D4A843;left:0;opacity:0}
      #open-sc.go .nib{animation:nib .52s linear 1.22s both}
      #open-sc .sig{display:flex;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#9A96A2}
      #open-sc .sig span{opacity:0;transform:translateY(3px)}
      #open-sc.go .sig span{animation:sig .24s ease-out both}
      #open-sc.go .sig span:nth-child(1){animation-delay:1.58s}
      #open-sc.go .sig span:nth-child(2){animation-delay:1.62s}
      #open-sc.go .sig span:nth-child(3){animation-delay:1.66s}
      #open-sc.go .sig span:nth-child(4){animation-delay:1.70s}
      #open-sc.go .sig span:nth-child(5){animation-delay:1.74s}
      #open-sc.go .sig span:nth-child(6){animation-delay:1.78s}
      #open-sc.go .sig span:nth-child(7){animation-delay:1.82s}
      #open-sc.go .sig span:nth-child(8){animation-delay:1.86s}
      #open-sc.go .sig span:nth-child(9){animation-delay:1.90s}
      #open-sc.go .sig span:nth-child(10){animation-delay:1.94s}
      #open-sc.go .sig span:nth-child(11){animation-delay:1.98s}
      #open-sc.go .sig span:nth-child(12){animation-delay:2.02s}
      #open-sc.go .sig span:nth-child(13){animation-delay:2.06s}

      @media (prefers-reduced-motion:reduce){
        #boot-sc *,#open-sc *,#boot-sc .mark,#open-sc .mark{animation:none!important}
        #boot-sc .barres,#open-sc .barres{opacity:0}
        #open-sc .word b{clip-path:none}
        #open-sc .sig span{opacity:1;transform:none}
        #open-sc .nib{display:none}
        #boot-sc .track i{left:0;width:100%;animation:fade 1.6s ease-in-out infinite!important}
      }

      /* ── ELGUSTOLIFT ────────────────────────────────────────────── */
      #boot-eg,#open-eg{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
                        background:#1b1a1f;opacity:1;transition:opacity .28s ease}
      #boot-eg{gap:26px}
      #open-eg{z-index:10000;gap:30px}
      #boot-eg.done,#open-eg.done{opacity:0;pointer-events:none}
      #boot-eg .mark{width:76px;height:76px;overflow:visible}
      #open-eg .mark{width:96px;height:96px;overflow:visible}
      .eg rect,.eg path{transform-box:fill-box}

      /* 1 — les quatre barres Hodos montent et se rangent sous la coiffe */
      .eg .t{transform-origin:50% 100%}
      @keyframes eg0{from{transform:translate(0.13px,9.1px) scale(0.9821,0.5248);fill:#D4A843;fill-opacity:.38}
                       to{transform:none;fill:#EEECF2;fill-opacity:1}}
      @keyframes eg1{from{transform:translate(0.39px,9.1px) scale(0.9821,0.8681);fill:#D4A843;fill-opacity:.66}
                       to{transform:none;fill:#EEECF2;fill-opacity:1}}
      @keyframes eg2{from{transform:translate(0.65px,9.1px) scale(0.9821,1.4171);fill:#D4A843;fill-opacity:1}
                       to{transform:none;fill:#EEECF2;fill-opacity:1}}
      @keyframes eg3{from{transform:translate(0.91px,9.1px) scale(0.9821,0.8314);fill:#A9A5B0;fill-opacity:1}
                       to{transform:none;fill:#EEECF2;fill-opacity:1}}

      /* 2 — la coiffe se gonfle depuis le bandeau */
      @keyframes eggonfle{from{rx:0;ry:0}to{rx:28px;ry:28px}}

      /* 3 — les barres s'éteignent sous la coiffe */
      @keyframes egeff{from{opacity:1}to{opacity:0}}

      /* 4 — le bandeau se déroule */
      @keyframes egband{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}

      /* 5 — les plis se posent */
      @keyframes egpli{from{opacity:0;transform:translateY(1.4px)}to{opacity:1;transform:none}}

      .eg .bandeau{transform-origin:50% 50%}

      #boot-eg .t0,#open-eg.go .t0{animation:eg0 .56s cubic-bezier(.65,0,.35,1) .18s both}
      #boot-eg .t1,#open-eg.go .t1{animation:eg1 .56s cubic-bezier(.65,0,.35,1) .22s both}
      #boot-eg .t2,#open-eg.go .t2{animation:eg2 .56s cubic-bezier(.65,0,.35,1) .26s both}
      #boot-eg .t3,#open-eg.go .t3{animation:eg3 .56s cubic-bezier(.65,0,.35,1) .30s both}
      #boot-eg .gonfle,#open-eg.go .gonfle{animation:eggonfle .48s cubic-bezier(.22,1,.36,1) .56s both}
      #boot-eg .barres,#open-eg.go .barres{animation:egeff .26s ease-in .78s both}
      #boot-eg .bandeau,#open-eg.go .bandeau{animation:egband .34s cubic-bezier(.34,1.4,.64,1) .94s both}
      #boot-eg .pli1,#open-eg.go .pli1{animation:egpli .26s ease-out 1.04s both}
      #boot-eg .pli2,#open-eg.go .pli2{animation:egpli .26s ease-out 1.10s both}
      #boot-eg .pli3,#open-eg.go .pli3{animation:egpli .26s ease-out 1.16s both}
      #open-eg .hold{visibility:hidden}
      #open-eg.go .hold{visibility:visible}

      /* barre de progression indéterminée (chargement) */
      #boot-eg .track{position:relative;width:96px;height:2px;background:#302e36;overflow:hidden;border-radius:2px}
      #boot-eg .track i{position:absolute;top:0;bottom:0;width:34%;background:#D4A843;animation:slide 1.15s cubic-bezier(.45,0,.55,1) .5s infinite}

      /* HODOS, puis BY ELGUSTOLIFT */
      #open-eg .word{position:relative;display:inline-block}
      #open-eg .word b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:58px;line-height:.9;
                       letter-spacing:.055em;text-transform:uppercase;color:#EEECF2;clip-path:inset(0 100% 0 0)}
      #open-eg.go .word b{animation:wipe .52s linear 1.22s both}
      #open-eg .nib{position:absolute;top:-4%;bottom:-4%;width:2px;background:#D4A843;left:0;opacity:0}
      #open-eg.go .nib{animation:nib .52s linear 1.22s both}
      #open-eg .sig{display:flex;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#9A96A2}
      #open-eg .sig span{opacity:0;transform:translateY(3px)}
      #open-eg.go .sig span{animation:sig .24s ease-out both}
      #open-eg.go .sig span:nth-child(1){animation-delay:1.58s}
      #open-eg.go .sig span:nth-child(2){animation-delay:1.62s}
      #open-eg.go .sig span:nth-child(3){animation-delay:1.66s}
      #open-eg.go .sig span:nth-child(4){animation-delay:1.70s}
      #open-eg.go .sig span:nth-child(5){animation-delay:1.74s}
      #open-eg.go .sig span:nth-child(6){animation-delay:1.78s}
      #open-eg.go .sig span:nth-child(7){animation-delay:1.82s}
      #open-eg.go .sig span:nth-child(8){animation-delay:1.86s}
      #open-eg.go .sig span:nth-child(9){animation-delay:1.90s}
      #open-eg.go .sig span:nth-child(10){animation-delay:1.94s}
      #open-eg.go .sig span:nth-child(11){animation-delay:1.98s}
      #open-eg.go .sig span:nth-child(12){animation-delay:2.02s}
      #open-eg.go .sig span:nth-child(13){animation-delay:2.06s}
      #open-eg.go .sig span:nth-child(14){animation-delay:2.10s}

      @media (prefers-reduced-motion:reduce){
        #boot-eg *,#open-eg *{animation:none!important}
        #boot-eg .barres,#open-eg .barres{opacity:0}
        #open-eg .word b{clip-path:none}
        #open-eg .sig span{opacity:1;transform:none}
        #open-eg .nib{display:none}
        #boot-eg .track i{left:0;width:100%;animation:fade 1.6s ease-in-out infinite!important}
      }
    </style>

        <div class="sig" aria-label="by ElGustoLift"><span>B</span><span>Y</span><span>&nbsp;</span><span>E</span><span>L</span><span>G</span><span>U</span><span>S</span><span>T</span><span>O</span><span>L</span><span>I</span><span>F</span><span>T</span></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Démarre quand la police est prête (sinon les lettres changent de dessin
      // en cours d'écriture). Plafond de 600 ms pour ne jamais bloquer.
      //
      // ⚠️ NE TOURNE QUE SI L'OUVERTURE EST CELLE QU'ON JOUE. En mode « boot »,
      // `#open` est masqué : lui poser `.go` déclencherait ses animations dans
      // le vide, et surtout ferait attendre `document.fonts.ready` pour rien.
      (function () {
        if (document.documentElement.dataset.intro !== 'open') return;
        var suffixe = { scappulift: '-sc', elgustolift: '-eg' }[document.documentElement.dataset.structure] || '';
        var el = document.getElementById('open' + suffixe);
        if (!el) return;
        var go = function () { el.classList.add('go'); };
        if (document.fonts && document.fonts.ready) {
          var t = setTimeout(go, 600);
          document.fonts.ready.then(function () { clearTimeout(t); go(); });
        } else { go(); }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA : service worker en prod uniquement. En local, on DÉSINSCRIT tout
      // SW résiduel et on purge ses caches — sinon un vieux SW de prod (ou du
      // v2) servirait des assets périmés pendant le dev.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          const isLocalDev = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
          if (isLocalDev) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
              if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.filter((key) => key.startsWith('eitri') || key.startsWith('ff-trainer')).map((key) => caches.delete(key)));
              }
            } catch (error) {
              console.warn('Service worker cleanup failed:', error);
            }
            return;
          }

          // ⚠️ L'ENREGISTREMENT A DÉMÉNAGÉ dans `lib/nouvelle-version.ts`
          // (22/08). Il vivait ici sans `.catch()`, alors que la branche de
          // développement juste au-dessus en avait un : toute rejection
          // remontait dans Sentry en « Unhandled », sous un titre `<anonymous>`
          // sans message ni cause. Dans le bundle, il peut SIGNALER la
          // dégradation — et il est voisin du code qui en dépend.
        });
      }
    </script>
