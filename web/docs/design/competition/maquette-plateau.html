class DCLogic {
  constructor(props){ this.props = props || {}; this.state = {}; }

const SVGTAGS = new Set(['svg','path','g','circle','ellipse','rect','line','text','polygon','polyline','defs','use']);

function lookup(path, ctx){
  if (path === 'true') return true;
  if (path === 'false') return false;
  let cur = ctx;
  for (const part of path.split('.')) {
    if (cur == null) return undefined;
    cur = cur[part];

  return cur;

function interp(str, ctx){
  return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => {
    const v = lookup(p, ctx);
    return v == null ? '' : String(v);

    if (node.nodeType === 3) {
      const t = interp(node.nodeValue, ctx);
      if (t.trim()) parent.appendChild(document.createTextNode(t));
      continue;
    }
    if (node.nodeType !== 1) continue;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = lookup(whole(node.getAttribute('list')) || '', ctx) || [];
      const as = node.getAttribute('as') || 'item';

        const c = Object.create(ctx); c[as] = item; c.$index = i;

      const v = lookup(whole(node.getAttribute('value')) || '', ctx);

                     : document.createElement(tag);

      const w = whole(raw);
      if (EVT[name.toLowerCase()]) {
        const fn = w ? lookup(w, ctx) : null;
        if (typeof fn === 'function') el.addEventListener(EVT[name.toLowerCase()], fn);
        continue;
      }

      if (name === 'disabled') { if (w ? lookup(w, ctx) : true) el.setAttribute('disabled', ''); continue; }

<script>

var ATH = [

var GROUPES = ['A', 'B'];

  }
