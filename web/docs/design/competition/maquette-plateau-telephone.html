const SVGTAGS = new Set(['svg','path','g','circle','ellipse','rect','line','text','polygon','polyline','defs','use']);
const EVT = { onclick:'click', onmouseenter:'mouseenter', onmouseleave:'mouseleave', onchange:'input', oninput:'input' };
function lookup(path, ctx){
  if (path === 'true') return true;
  if (path === 'false') return false;
  let cur = ctx;
  for (const part of path.split('.')) {
    if (cur == null) return undefined;
    cur = cur[part];
  }
  return cur;
}
function interp(str, ctx){
  return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => {
    const v = lookup(p, ctx);
    return v == null ? '' : String(v);
  });
}
function whole(str){ const m = str.match(/^\{\{\s*([^}]+?)\s*\}\}$/); return m ? m[1] : null; }
function renderNodes(nodes, ctx, parent, svg){
  for (const node of nodes) {
    if (node.nodeType === 3) {
      const t = interp(node.nodeValue, ctx);
      if (t.trim()) parent.appendChild(document.createTextNode(t));
      continue;
    }
    if (node.nodeType !== 1) continue;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = lookup(whole(node.getAttribute('list')) || '', ctx) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => {
        const c = Object.create(ctx); c[as] = item; c.$index = i;
        renderNodes([...node.childNodes], c, parent, svg);
      });
      continue;
    }
    if (tag === 'sc-if') {
      const v = lookup(whole(node.getAttribute('value')) || '', ctx);
      if (v) renderNodes([...node.childNodes], ctx, parent, svg);
      continue;
    }
    const isSvg = svg || SVGTAGS.has(tag);
    const el = isSvg ? document.createElementNS('http://www.w3.org/2000/svg', tag)
                     : document.createElement(tag);
    for (const attr of [...node.attributes]) {
      const name = attr.name, raw = attr.value;
      const w = whole(raw);
      if (EVT[name.toLowerCase()]) {
        const fn = w ? lookup(w, ctx) : null;
        if (typeof fn === 'function') el.addEventListener(EVT[name.toLowerCase()], fn);
        continue;
      }
      if (name.startsWith('hint-')) continue;
      if (name === 'disabled') { if (w ? lookup(w, ctx) : true) el.setAttribute('disabled', ''); continue; }
      if (name === 'value' && tag === 'input') { el.value = w ? (lookup(w, ctx) ?? '') : raw; continue; }
      el.setAttribute(name, interp(raw, ctx));

};

function kgDe(a) { return a.sel === 'p' ? a.p : a.sel === 'r' ? a.r : a.sel === 'o' ? a.o : 0; }

class Component extends DCLogic {

-items: baseline; justify-content: space-between;\">\n<span style=\"font-size: 12px; color: #A9A5B0;\">Plan de l'essai \u2014 annonce une charge</span>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6E6A76;\">{{plancherTexte}}</span>\n</div>\n<div style=\"display: flex; gap: 6px;\">\n<sc-for list=\"{{plans}}\" as=\"p\" hint-placeholder-count=\"3\">\n<button type=\"button\" onClick=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\" style=\"flex-grow: 1; height: 54px; border-radius: 10px; border: 1px solid {{p.bord}}; background: {{p.fond}}; color: {{p.texte}}; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600;\">{{p.kg}}</span>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px;\">{{p.label}}</span>\n</button>\n</sc-for>\n<button type=\"button\" aria-label=\"Autre charge\" style=\"width: 54px; height: 54px; border-radius: 10px; border: 1px dashed #3A3940; background: transparent; color: #9A96A2; font-family: 'IBM Plex Mono', monospace; font-size: 18px; cursor: pointer;\">\u00b1</button>\n</div>\n<div style=\"display: flex; gap: 8px;\">\n<button type=\"button\" onClick=\"{{rep}}\" style=\"flex-grow: 1; height: 62px; border-radius: 12px; border: none; background: {{repFond}}; color: {{repTexte}}; font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer;\">\u2713 REP</button>\n<button type=\"button\" onClick=\"{{norep}}\" style=\"flex-grow: 1; height: 62px; border-radius: 12px; border: none; background: {{norepFond}}; color: {{norepTexte}}; font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer;\">\u2715 NO REP</button>\n</div>\n<sc-if value=\"{{montreMotifs}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; gap: 6px; overflow-x: auto;\">\n<sc-for list=\"{{motifs}}\" as=\"m\" hint-pla er; gap: 6px;\">\n<sc-for list=\"{{vues}}\" as=\"v\" hint-placeholder-count=\"2\">\n<button type=\"button\" onClick=\"{{v.pick}}\" aria-pressed=\"{{v.on}}\" style=\"height: 32px; padding: 0 12px; border-radius: 8px; border: none; background: {{v.fond}}; color: {{v.texte}}; font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;\">{{v.label}}</button>\n</sc-for>\n<span style=\"flex-grow: 1;\"></span>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #D4A843;\">{{feuilleTotal}} kg</span>\n</div>\n<sc-if value=\"{{vueFeuille}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<sc-for list=\"{{feuille}}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; align-items: center; gap: 8px;\">\n<span style=\"width: 74px; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: {{f.couleur}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{f.nom}}</span>\n<sc-for list=\"{{f.cases}}\" as=\"c\" hint-placeholder-count=\"3\">\n<button type=\"button\" onClick=\"{{c.pick}}\" aria-label=\"{{c.aria}}\" style=\"flex-grow: 1; height: 46px; padding: 0; border-radius: 9px; border: {{c.bordure}}; background: {{c.fond}}; color: {{c.texte}}; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; cursor: pointer;\">\n<span style=\"font-size: 14px;\">{{c.kg}}</span>\n<span style=\"font-size: 9px; letter-spacing: 0.5px; color: {{c.tierCouleur}};\">{{c.tier}}</span>\n</button>\n</sc-for>\n</div>\n</sc-for>\n</div>\n</sc-if>\n<sc-if value=\"{{vueClassement}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px;\">\n<sc-for list=\"{{classement}}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; align-items: center; gap: 8px; padding: 7px 8px; b
