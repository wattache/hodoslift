# `buf generate` depuis proto/ (ou `make gen` à la racine) : Go pour sindri. Le
# code engendré est COMMITTÉ, comme docs/openapi.json l'était : le contrat se lit
# sans outil, et `make contrat` refuse une dérive.
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: ../api/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../api/gen
    opt: paths=source_relative
